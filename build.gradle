plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        worldreroll {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
loom.runConfigs.named('client') { runDirectory = file('run/client') }
loom.runConfigs.named('server') { runDirectory = file('run/server') }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:6.0.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'worldreroll_test'
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = false
    }
}
def modVersion = project.version.toString()
processResources {
    inputs.property('version', modVersion)
    filesMatching('fabric.mod.json') { expand(version: modVersion) }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}
jar { from('LICENSE') }
